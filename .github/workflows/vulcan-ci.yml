name: Vulcan CI

run-name: ${{ github.event.head_commit.message || github.event.pull_request.title || github.ref_name || 'Vulcan CI' }} (${{ vars.VULCAN_ENV || 'dev' }})

on:
  push:
    branches:
      - "**"
    tags:
      - "*"
  pull_request:
  workflow_dispatch: {}

# Fork PR validation needs only repository read access. Grant additional
# permissions only to the guarded jobs that use them.
permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref_type == 'branch' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build sima-cli
    runs-on: ubuntu-latest
    outputs:
      branch_key: ${{ steps.meta.outputs.branch_key }}
      ref_name: ${{ steps.meta.outputs.ref_name }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve build metadata
        id: meta
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="$(python scripts/set_build_version.py --tag "${GITHUB_REF_NAME}")"
          else
            ref_name="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
            version="$(python scripts/set_build_version.py --ref "${ref_name}" --sha "${GITHUB_SHA}")"
          fi
          ref_name="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          branch_key="$(python3 - <<'PY'
          import os
          from urllib.parse import quote
          ref_name = os.environ.get("GITHUB_HEAD_REF") or os.environ["GITHUB_REF_NAME"]
          print(quote(ref_name, safe=""))
          PY
          )"
          short_sha="$(printf '%s' "${GITHUB_SHA}" | cut -c1-12)"
          {
            echo "version=${version}"
            echo "ref_name=${ref_name}"
            echo "branch_key=${branch_key}"
            echo "short_sha=${short_sha}"
          } >> "${GITHUB_OUTPUT}"
          echo "Building sima-cli ${version}"

      - name: Build and test
        run: |
          set -euo pipefail

          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -r dev-requirements.txt

          python -m build --wheel

          python - <<'PY'
          import hashlib
          import json
          import os
          import textwrap
          import zipfile
          from pathlib import Path

          dist = Path("dist")
          wheel = sorted(dist.glob("*.whl"))[-1]
          version = wheel.name.split("-")[1]
          package = dist / f"sima-cli-package-{version}.zip"
          metadata = {
              "wheel": wheel.name,
              "helpers": [
                  "linux-mac.sh",
                  "windows.bat",
              ],
              "commit": os.environ["GITHUB_SHA"],
              "ref": os.environ.get("GITHUB_HEAD_REF") or os.environ["GITHUB_REF_NAME"],
          }

          with zipfile.ZipFile(package, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              zf.write(wheel, wheel.name)
              zf.write("scripts/install/linux-mac.sh", "linux-mac.sh")
              zf.write("scripts/install/windows.bat", "windows.bat")
              zf.writestr("install_metadata.json", json.dumps(metadata, indent=2) + "\n")

          target_stub = dist / "install.py"
          target_stub.write_text(Path("scripts/install/install.py").read_text(encoding="utf-8"), encoding="utf-8")
          package_installer = dist / "install_vulcan_package.py"
          package_installer.write_text(textwrap.dedent(r'''
              #!/usr/bin/env python3
              """Install the downloaded sima-cli Vulcan package."""

              from __future__ import annotations

              import platform
              import subprocess
              import tempfile
              import zipfile
              from pathlib import Path


              def find_one(root: Path, pattern: str) -> Path:
                  matches = sorted(root.glob(pattern))
                  if not matches:
                      raise SystemExit(f"Unable to find {pattern} under {root}")
                  return matches[-1]


              def main() -> int:
                  package = find_one(Path.cwd(), "sima-cli-package-*.zip")
                  with tempfile.TemporaryDirectory(prefix="sima-cli-vulcan-install-") as tmp:
                      package_dir = Path(tmp) / "package"
                      package_dir.mkdir(parents=True, exist_ok=True)
                      with zipfile.ZipFile(package) as zf:
                          zf.extractall(package_dir)

                      wheel = find_one(package_dir, "*.whl")
                      if platform.system().lower() == "windows":
                          helper = find_one(package_dir, "windows.bat")
                          cmd = ["cmd.exe", "/c", str(helper), str(wheel)]
                      else:
                          helper = find_one(package_dir, "linux-mac.sh")
                          helper.chmod(helper.stat().st_mode | 0o755)
                          cmd = ["bash", str(helper), str(wheel)]
                      subprocess.run(cmd, check=True)
                  return 0


              if __name__ == "__main__":
                  raise SystemExit(main())
              ''').lstrip(), encoding="utf-8")
          package_installer.chmod(0o755)

          resources = [
              package_installer.name,
              package.name,
          ]

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          total_size = sum((dist / resource).stat().st_size for resource in resources)
          metadata_json = {
              "name": "gh:sima-neat/sima-cli",
              "version": version,
              "release": "",
              "description": "SiMa.ai command-line tooling",
              "platforms": [],
              "resources": resources,
              "resources-checksum": {
                  resource: sha256(dist / resource)
                  for resource in resources
              },
              "selectable-resources": [],
              "size": {
                  "download": f"{max(1, (total_size + 1023) // 1024)}KB",
                  "install": f"{max(1, (total_size + 1023) // 1024)}KB",
              },
              "installation": {
                  "script": "python3 install_vulcan_package.py || python install_vulcan_package.py",
                  "post-message": "[bold]sima-cli installed successfully.[/bold]\n",
              },
          }
          metadata_path = dist / "metadata.json"
          metadata_path.write_text(json.dumps(metadata_json, indent=2) + "\n", encoding="utf-8")
          print(f"Created {package}")
          print(f"Created {target_stub}")
          print(f"Created {package_installer}")
          print(f"Created {metadata_path}")
          PY

          python -m pip install dist/*.whl
          scripts/run-tests.sh unit
          python scripts/check_py_compatibility.py sima_cli --targets "3.8,3.9,3.10,3.11,3.12,3.13,3.14"

      - name: Validate dist artifacts
        run: |
          set -euo pipefail

          mapfile -t WHEELS < <(find dist -maxdepth 1 -type f -name '*.whl' | sort)
          mapfile -t PACKAGES < <(find dist -maxdepth 1 -type f -name 'sima-cli-package-*.zip' | sort)
          test -f dist/install.py
          test -f dist/install_vulcan_package.py
          test -f dist/metadata.json
          python3 -m json.tool dist/metadata.json >/dev/null

          if [[ "${#WHEELS[@]}" -ne 1 || "${#PACKAGES[@]}" -ne 1 ]]; then
            echo "Expected exactly one sima-cli wheel and one installer package." >&2
            echo "wheels: ${#WHEELS[@]}" >&2
            printf '  %s\n' "${WHEELS[@]}" >&2 || true
            echo "packages: ${#PACKAGES[@]}" >&2
            printf '  %s\n' "${PACKAGES[@]}" >&2 || true
            exit 1
          fi

          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          package = sorted(Path("dist").glob("sima-cli-package-*.zip"))[-1]
          with zipfile.ZipFile(package) as zf:
              names = set(zf.namelist())
          required = {"linux-mac.sh", "windows.bat", "install_metadata.json"}
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"{package} is missing {missing}")
          if not any(name.endswith(".whl") for name in names):
              raise SystemExit(f"{package} does not contain a wheel")

          import json
          metadata = json.loads(Path("dist/metadata.json").read_text(encoding="utf-8"))
          resources = metadata.get("resources", [])
          required_resources = {"install_vulcan_package.py", package.name}
          missing_resources = sorted(required_resources - set(resources))
          if missing_resources:
              raise SystemExit(f"metadata.json is missing resources: {missing_resources}")
          for resource in resources:
              if not (Path("dist") / resource).is_file():
                  raise SystemExit(f"metadata.json references missing resource: {resource}")
          PY
          ls -lh dist

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: sima-cli-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  windows-msi:
    name: Test built CLI wheel with Windows Installer
    needs: build
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: sima-cli-dist
          path: candidate-dist
      - name: Install the exact built wheel
        shell: pwsh
        env:
          EXPECTED_CLI_VERSION: ${{ needs.build.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $wheels = @(Get-ChildItem -LiteralPath candidate-dist -Filter 'sima_cli-*.whl' -File)
          if ($wheels.Count -ne 1) { throw "Expected exactly one built CLI wheel" }
          python -m pip install $wheels[0].FullName
          if ($LASTEXITCODE -ne 0) { throw "Candidate CLI installation failed" }
          python -I -c "import importlib.metadata as m, os; assert m.version('sima-cli') == os.environ['EXPECTED_CLI_VERSION']"
          if ($LASTEXITCODE -ne 0) { throw "Installed CLI version differs from the build artifact" }
      - name: Exercise declarative MSI installation on native Windows
        shell: pwsh
        run: python -I tests/e2e/windows_msi_install.py --work-directory "$env:RUNNER_TEMP\windows-msi-e2e"
      - name: Retain MSI build and install diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-msi-e2e
          path: ${{ runner.temp }}/windows-msi-e2e
          if-no-files-found: warn
          retention-days: 7

  compatibility-test:
    name: Compatibility Python ${{ matrix.python-version }}
    # Python 3.8/3.9 builds are unavailable on Ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-22.04
    needs: build
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download built dist
        uses: actions/download-artifact@v8
        with:
          name: sima-cli-dist
          path: dist

      - name: Set package version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="$(python scripts/set_build_version.py --tag "${GITHUB_REF_NAME}")"
          else
            ref_name="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
            version="$(python scripts/set_build_version.py --ref "${ref_name}" --sha "${GITHUB_SHA}")"
          fi
          echo "Testing sima-cli ${version}"

      - name: Run compatibility tests
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -type f -name 'sima_cli-*.whl' -print -quit)"
          if [[ -z "$wheel" ]]; then
            echo "No sima-cli wheel found in dist" >&2
            exit 1
          fi
          python scripts/check_py_compatibility.py sima_cli --targets "${{ matrix.python-version }}"
          scripts/run-tests.sh compat --versions "${{ matrix.python-version }}" --strict --wheel "$wheel"

  docs-translations:
    name: Check documentation translations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check translations
        # Same coverage and source-hash rule Core's docs build applies when it imports these docs.
        run: python scripts/check_translation_sources.py

  # Approval permits fork PR validation; it does not grant cloud access or
  # permission to execute contributor code on our self-hosted runners.
  resolve-vulcan-config:
    permissions:
      contents: read
      id-token: write
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Resolve Vulcan Config
    needs: build
    uses: sima-neat/.github/.github/workflows/vulcan-resolve-config.yml@main
    with:
      vulcan_env: ${{ vars.VULCAN_ENV || 'dev' }}

  publish-vulcan-artifacts:
    permissions:
      contents: read
      actions: write
      id-token: write
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Publish to Vulcan
    needs:
      - resolve-vulcan-config
      - build
      - compatibility-test
      - windows-msi
    uses: sima-neat/.github/.github/workflows/vulcan-publish-artifacts.yml@main
    with:
      aws_region: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
      environment_name: ${{ needs.resolve-vulcan-config.outputs.vulcan_env }}
      bucket: ${{ needs.resolve-vulcan-config.outputs.artifact_bucket }}
      role_to_assume: ${{ needs.resolve-vulcan-config.outputs.artifact_publisher_role_arn }}
      sse_kms_key_id: ${{ needs.resolve-vulcan-config.outputs.artifact_kms_key_id }}
      cloudfront_distribution_id: ${{ needs.resolve-vulcan-config.outputs.artifact_cloudfront_distribution_id }}
      artifact_folder: "."
      artifact_pattern: sima-cli-dist
      artifact_glob: "*"
      min_artifact_count: 5

  e2e-install:
    permissions:
      contents: read
      packages: read
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: E2E Install (${{ matrix.name }})
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    needs:
      - build
      - publish-vulcan-artifacts
    env:
      GITHUB_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runs_on: '["self-hosted","macOS","osx"]'
          - name: Ubuntu x86
            runs_on: '"ubuntu-24.04"'
            docker_install: apt
          # Paused until Snap Store access stabilizes. See #412.
          # - name: Ubuntu x86 Snap Docker
          #   runs_on: '"ubuntu-24.04"'
          #   docker_install: snap
          - name: Ubuntu ARM64
            runs_on: '"ubuntu-24.04-arm"'
          - name: Windows
            runs_on: '"windows-latest"'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install workflow sima-cli
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/workflow-sima-cli"
          "${RUNNER_TEMP}/workflow-sima-cli/bin/python" -m pip install --upgrade pip
          "${RUNNER_TEMP}/workflow-sima-cli/bin/python" -m pip install .
          echo "${RUNNER_TEMP}/workflow-sima-cli/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/workflow-sima-cli/bin/sima-cli" --version

      - name: Install workflow sima-cli on native Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          sima-cli --version

      - name: Test repo installer script
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          export HOME="${RUNNER_TEMP}/repo-installer-home"
          mkdir -p "$HOME"
          bash scripts/install/linux-mac.sh
          "$HOME/.sima-cli/.venv/bin/sima-cli" --version

      - name: Test repo installer script on native Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP "repo-installer-home"
          New-Item -ItemType Directory -Force -Path $env:USERPROFILE | Out-Null
          $scripts = Join-Path $env:USERPROFILE ".sima-cli-env\Scripts"
          # Raw PATH values as a new window reads them; the runner's own are restored at the end.
          $userKey = [Microsoft.Win32.Registry]::CurrentUser.CreateSubKey("Environment")
          $machineKey = [Microsoft.Win32.Registry]::LocalMachine.OpenSubKey("SYSTEM\CurrentControlSet\Control\Session Manager\Environment", $true)
          function Get-RawPath($key) { [string]$key.GetValue("Path", "", "DoNotExpandEnvironmentNames") }
          function Set-RawPath($key, $value) {
            $kind = "ExpandString"
            if ($null -ne $key.GetValue("Path")) { $kind = $key.GetValueKind("Path") }
            $key.SetValue("Path", $value, $kind)
          }
          $saved = foreach ($key in $userKey, $machineKey) {
            $value = $key.GetValue("Path", $null, "DoNotExpandEnvironmentNames")
            if ($null -eq $value) { , @($key, $null, $null) } else { , @($key, $value, $key.GetValueKind("Path")) }
          }
          $installer = (Resolve-Path scripts\install\windows.bat).Path
          function Invoke-Installer {
            $global:installerOutput = (cmd.exe /c $installer @args) -join "`n"
            $global:installerCode = $LASTEXITCODE
            Write-Host $global:installerOutput
          }
          function Assert-Output($text) { if (-not $global:installerOutput.Contains($text)) { throw "windows.bat did not print: $text" } }
          try {
            # Set aside any sima-cli the runner image already has on PATH, so the warnings name only the stubs below.
            function Test-SimaCli($entry) {
              $folder = [Environment]::ExpandEnvironmentVariables($entry).Trim().Trim('"').TrimEnd('\')
              $folder -and @("sima-cli.exe", "sima-cli.bat", "sima-cli.cmd" | Where-Object { [IO.File]::Exists("$folder\$_") }).Count
            }
            $userBase = (@((Get-RawPath $userKey).Split(";") | Where-Object { -not (Test-SimaCli $_) }) -join ";").TrimEnd(";")
            $machineBase = @((Get-RawPath $machineKey).Split(";") | Where-Object { -not (Test-SimaCli $_) }) -join ";"
            # A pip-installed sima-cli earlier in the user PATH, and another account's environment on the system PATH.
            $userStub = Join-Path $env:RUNNER_TEMP "pip-python\Scripts"
            $machineStub = Join-Path $env:RUNNER_TEMP "other-account\.sima-cli-env\Scripts"
            foreach ($stub in $userStub, $machineStub) {
              New-Item -ItemType Directory -Force -Path $stub | Out-Null
              Set-Content -LiteralPath (Join-Path $stub "sima-cli.cmd") -Value "@echo stub sima-cli"
            }
            # Old installers' state: this user's environment repeated in the user PATH, and on the system PATH.
            Set-RawPath $userKey "$userBase;$userStub;$scripts;$($scripts.ToUpper())\;$scripts"
            Set-RawPath $machineKey "$machineBase;$scripts"
            Invoke-Installer
            if ($installerCode -ne 0) { throw "windows.bat failed with exit code $installerCode" }
            Assert-Output "Removing 2 repeated $scripts entries from the user PATH..."
            Assert-Output "Removing $scripts from the system PATH..."
            if ((Get-RawPath $userKey) -cne "$userBase;$userStub;$scripts") { throw "Unexpected user PATH: $(Get-RawPath $userKey)" }
            if ((Get-RawPath $machineKey) -cne $machineBase) { throw "Unexpected system PATH: $(Get-RawPath $machineKey)" }
            Assert-Output "WARNING: a new window will run another sima-cli, not the one just installed:`n    $userStub\sima-cli.cmd`n  It is on your user PATH, ahead of $scripts.`n  Uninstall that copy, or remove $userStub from the user PATH if nothing else needs it."
            Assert-Output "run it by its full path, in PowerShell:`n    & `"$scripts\sima-cli.exe`""
            if ($installerOutput.Contains("Done.")) { throw "windows.bat printed Done. although another sima-cli runs first" }
            # The system PATH comes first. The other account's entry is named and left in place.
            Set-RawPath $machineKey "$machineStub;$machineBase"
            Invoke-Installer
            if ($installerCode -ne 0) { throw "windows.bat failed with exit code $installerCode" }
            Assert-Output "Already in the user PATH."
            Assert-Output "    $machineStub\sima-cli.cmd`n  It is on the system PATH, which Windows searches before your user PATH.`n  It is the sima-cli of another account."
            if ((Get-RawPath $machineKey) -cne "$machineStub;$machineBase") { throw "windows.bat changed another account's system PATH entry" }
            Set-RawPath $userKey "$userBase;$scripts"
            Set-RawPath $machineKey $machineBase
            & "$scripts\sima-cli.exe" --version
            if ($LASTEXITCODE -ne 0) { throw "sima-cli does not run from the installed environment" }
            # An environment whose base Python is gone is recreated, not reused.
            $config = Join-Path $env:USERPROFILE ".sima-cli-env\pyvenv.cfg"
            (Get-Content -LiteralPath $config) -replace '^home = .*', 'home = C:\sima-cli-missing-python' | Set-Content -LiteralPath $config
            Invoke-Installer
            if ($installerCode -ne 0) { throw "windows.bat did not recreate a broken environment: exit code $installerCode" }
            Assert-Output "Done. Open a new Command Prompt or PowerShell and type:"
            & "$scripts\sima-cli.exe" --version
            if ($LASTEXITCODE -ne 0) { throw "sima-cli does not run from the recreated environment" }
            # A python that is a batch file, as pyenv-win's shim first on PATH, does not end the script:
            # with no environment yet, it creates one from the interpreter that shim runs, and installs.
            $wheelDir = Join-Path $env:RUNNER_TEMP "checkout-wheel"
            python -m pip wheel --no-deps --wheel-dir $wheelDir .
            if ($LASTEXITCODE -ne 0) { throw "Could not build the sima-cli wheel of this checkout" }
            $wheel = @(Get-ChildItem -LiteralPath $wheelDir -Filter "sima_cli-*.whl")[0].FullName
            $expected = (sima-cli --version) -join "`n"
            if ($LASTEXITCODE -ne 0) { throw "The workflow sima-cli does not report its version" }
            $pathShims = Join-Path $env:RUNNER_TEMP "path-shims"
            New-Item -ItemType Directory -Force -Path $pathShims | Out-Null
            Set-Content -LiteralPath (Join-Path $pathShims "python.bat") -Value "@`"$((Get-Command python -CommandType Application)[0].Source)`" %*"
            Remove-Item -LiteralPath (Join-Path $env:USERPROFILE ".sima-cli-env") -Recurse -Force
            $savedPath = $env:PATH
            $env:PATH = "$pathShims;$env:PATH"
            Invoke-Installer $wheel
            $env:PATH = $savedPath
            if ($installerCode -ne 0) { throw "windows.bat failed with exit code $installerCode behind a python.bat on PATH" }
            Assert-Output "Creating virtual environment in $env:USERPROFILE\.sima-cli-env..."
            Assert-Output "Done. Open a new Command Prompt or PowerShell and type:"
            $version = (& "$scripts\sima-cli.exe" --version) -join "`n"
            if ($LASTEXITCODE -ne 0 -or $version -cne $expected) { throw "Installed sima-cli reports '$version', expected '$expected'" }
            # Run from a folder with a python.bat and a python.cmd that do nothing, the script uses the
            # environment's python by its path: it neither ends early nor looks for another Python.
            $cwdShims = Join-Path $env:RUNNER_TEMP "cwd-shims"
            New-Item -ItemType Directory -Force -Path $cwdShims | Out-Null
            foreach ($name in "python.bat", "python.cmd") { Set-Content -LiteralPath (Join-Path $cwdShims $name) -Value "@exit /b 0" }
            Push-Location $cwdShims
            Invoke-Installer $wheel
            Pop-Location
            if ($installerCode -ne 0) { throw "windows.bat failed with exit code $installerCode from a folder with python.bat and python.cmd" }
            Assert-Output "Installing/Upgrading sima-cli from $wheel..."
            Assert-Output "Done. Open a new Command Prompt or PowerShell and type:"
            if ($installerOutput.Contains("No working Python found")) { throw "windows.bat looked for another Python although its environment works" }
            if ($installerOutput.Contains("needs 64-bit Python 3.14")) { throw "windows.bat printed the Python 3.14 note although it created no environment" }
            $version = (& "$scripts\sima-cli.exe" --version) -join "`n"
            if ($LASTEXITCODE -ne 0 -or $version -cne $expected) { throw "Installed sima-cli reports '$version', expected '$expected'" }
            # A python on PATH whose path has a character the console code page lacks: cmd reads the path it
            # prints changed. With no environment, no py and no python.org 3.14, the script still installs.
            Write-Host "Code pages: console output $([Console]::OutputEncoding.CodePage), ANSI $((Get-Culture).TextInfo.ANSICodePage), OEM $((Get-Culture).TextInfo.OEMCodePage)"
            $accented = Join-Path $env:RUNNER_TEMP "Jos$([char]0xE9)\python"
            python -m venv $accented
            if ($LASTEXITCODE -ne 0) { throw "Could not create a Python under $accented" }
            $readBack = Join-Path $env:RUNNER_TEMP "read-back.bat"
            Set-Content -LiteralPath $readBack -Value '@for /f "delims=" %%P in (''python -c "import sys; print(sys.executable)" 2^>nul ^<nul'') do @if exist "%%P" (echo Log only: cmd reads back a path that exists: %%P) else (echo Log only: cmd reads back a path that does not exist: %%P)'
            Remove-Item -LiteralPath (Join-Path $env:USERPROFILE ".sima-cli-env") -Recurse -Force
            $savedVars = @{ PATH = $env:PATH; LOCALAPPDATA = $env:LOCALAPPDATA; ProgramFiles = $env:ProgramFiles }
            $env:PATH = "$accented\Scripts;$env:SystemRoot\System32;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
            $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "no-python"
            $env:ProgramFiles = $env:LOCALAPPDATA
            cmd.exe /c $readBack
            Invoke-Installer $wheel
            foreach ($name in $savedVars.Keys) { Set-Item -LiteralPath "env:$name" -Value $savedVars[$name] }
            if ($installerCode -ne 0) { throw "windows.bat failed with exit code $installerCode with python under $accented" }
            Assert-Output "Creating virtual environment in $env:USERPROFILE\.sima-cli-env..."
            Assert-Output "Done. Open a new Command Prompt or PowerShell and type:"
            if ($installerOutput.Contains("No working Python found")) { throw "windows.bat did not use the python under $accented" }
            $version = (& "$scripts\sima-cli.exe" --version) -join "`n"
            if ($LASTEXITCODE -ne 0 -or $version -cne $expected) { throw "Installed sima-cli reports '$version', expected '$expected'" }
            # A python whose path has a caret, a percent sign and a space, which call changes if they are
            # expanded before it parses the line again. With no environment, the script creates one from it.
            $special = Join-Path $env:RUNNER_TEMP "caret^ and 100% sign\python"
            python -m venv $special
            if ($LASTEXITCODE -ne 0) { throw "Could not create a Python under $special" }
            Remove-Item -LiteralPath (Join-Path $env:USERPROFILE ".sima-cli-env") -Recurse -Force
            $savedVars = @{ PATH = $env:PATH; LOCALAPPDATA = $env:LOCALAPPDATA; ProgramFiles = $env:ProgramFiles }
            $env:PATH = "$special\Scripts;$env:SystemRoot\System32;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
            $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "no-python"
            $env:ProgramFiles = $env:LOCALAPPDATA
            Invoke-Installer $wheel
            foreach ($name in $savedVars.Keys) { Set-Item -LiteralPath "env:$name" -Value $savedVars[$name] }
            if ($installerCode -ne 0) { throw "windows.bat failed with exit code $installerCode with python under $special" }
            Assert-Output "Creating virtual environment in $env:USERPROFILE\.sima-cli-env..."
            Assert-Output "Done. Open a new Command Prompt or PowerShell and type:"
            if ($installerOutput.Contains("No working Python found")) { throw "windows.bat did not use the python under $special" }
            $version = (& "$scripts\sima-cli.exe" --version) -join "`n"
            if ($LASTEXITCODE -ne 0 -or $version -cne $expected) { throw "Installed sima-cli reports '$version', expected '$expected'" }
            # A failed pip step fails the script.
            $invalidWheel = Join-Path $env:RUNNER_TEMP "sima_cli-0.0.0-py3-none-any.whl"
            Set-Content -LiteralPath $invalidWheel -Value "not a wheel"
            Invoke-Installer $invalidWheel
            if ($installerCode -ne 1) { throw "windows.bat returned $installerCode although pip failed" }
            Assert-Output "Could not install sima-cli into $env:USERPROFILE\.sima-cli-env. See the pip output above."
            # A refused Python bootstrap fails the script. With no sima-cli environment, no Python on PATH
            # or in the python.org locations, and TEMP under a file, it cannot create its download directory.
            $blocker = Join-Path $env:RUNNER_TEMP "not-a-directory"
            Set-Content -LiteralPath $blocker -Value ""
            $savedEnv = @{ PATH = $env:PATH; TEMP = $env:TEMP; LOCALAPPDATA = $env:LOCALAPPDATA; ProgramFiles = $env:ProgramFiles; USERPROFILE = $env:USERPROFILE }
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
            $env:TEMP = $blocker
            $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "no-python"
            $env:ProgramFiles = $env:LOCALAPPDATA
            $env:USERPROFILE = $env:LOCALAPPDATA
            $output = cmd.exe /c scripts\install\windows.bat
            $code = $LASTEXITCODE
            foreach ($name in $savedEnv.Keys) { Set-Item -LiteralPath "env:$name" -Value $savedEnv[$name] }
            $output
            if (-not ($output -match "^Could not create a new download directory: ")) { throw "windows.bat did not reach the Python download refusal" }
            if ($code -eq 0) { throw "windows.bat reported success although it refused to install Python" }
            # Uninstall stops while a package installed with Windows Installer is recorded.
            $state = Join-Path $env:USERPROFILE ".sima-cli"
            $registry = Join-Path $state "registry.json"
            $receipt = '[{"package_name": "gh:sima-neat/tests/windows-msi", "version": "1.0.0", "state": "installed", "metadata": {"installation": {"type": "windows-msi"}}}]'
            New-Item -ItemType Directory -Force -Path $state | Out-Null
            Set-Content -LiteralPath $registry -Value $receipt
            Invoke-Installer uninstall
            if ($installerCode -ne 1) { throw "windows.bat uninstall returned $installerCode although an MSI receipt is recorded" }
            Assert-Output "    sima-cli packages remove gh:sima-neat/tests/windows-msi --version 1.0.0"
            if (-not (Test-Path -LiteralPath $scripts)) { throw "windows.bat uninstall removed the environment although it refused" }
            # Without receipts, uninstall removes the environment and this user's PATH entries, also on the system PATH.
            Remove-Item -LiteralPath $registry
            Set-RawPath $machineKey "$machineBase;$scripts"
            Invoke-Installer uninstall
            if ($installerCode -ne 0) { throw "windows.bat uninstall failed with exit code $installerCode" }
            if (Test-Path -LiteralPath (Join-Path $env:USERPROFILE ".sima-cli-env")) { throw "windows.bat uninstall left the environment" }
            if ((Get-RawPath $userKey) -cne $userBase) { throw "Unexpected user PATH after uninstall: $(Get-RawPath $userKey)" }
            if ((Get-RawPath $machineKey) -cne $machineBase) { throw "Unexpected system PATH after uninstall: $(Get-RawPath $machineKey)" }
            if (-not (Test-Path -LiteralPath $state)) { throw "windows.bat uninstall removed the sima-cli state folder" }
            Assert-Output "sima-cli is removed."
            # --force goes ahead and says where to remove the recorded packages.
            Set-Content -LiteralPath $registry -Value $receipt
            Invoke-Installer uninstall --force
            if ($installerCode -ne 0) { throw "windows.bat uninstall --force failed with exit code $installerCode" }
            Assert-Output "Remove them later under Settings > Apps > Installed apps."
          } finally {
            foreach ($entry in $saved) {
              if ($null -eq $entry[1]) { $entry[0].DeleteValue("Path", $false) } else { $entry[0].SetValue("Path", $entry[1], $entry[2]) }
            }
          }
          # The failures above are the expected results; do not let them become the step's exit code.
          $global:LASTEXITCODE = 0

      - name: Test the repo installer script's Python installer check on native Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # windows.bat downloads and checks Python only on a PC without one, which this runner is not.
          # Run its own lines here as it runs them: from PowerShell 7, through cmd, in Windows PowerShell 5.1.
          # Its installer run and the steps after it are not executed here.
          $script = Get-Content -LiteralPath scripts\install\windows.bat
          function Get-Line($pattern) {
            $found = @($script | Where-Object { $_ -match $pattern })
            if ($found.Count -ne 1) { throw "windows.bat has $($found.Count) lines matching $pattern" }
            $found[0]
          }
          # The script's preparation is everything before it reads its arguments.
          $prepare = $script[0..([Array]::IndexOf($script, (Get-Line '^set "WHEEL_PATH=')) - 1)]
          $pinned = (Get-Line '^\s*set "PYTHON_URL='), (Get-Line '^\s*set "PYTHON_SHA256=')
          $download = Get-Line 'Invoke-WebRequest -Uri'
          $verify = Get-Line 'Get-AuthenticodeSignature -LiteralPath'
          $work = Join-Path $env:RUNNER_TEMP "python-installer-check"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          function Invoke-Lines($name, $lines) {
            $bat = Join-Path $work "$name.bat"
            Set-Content -LiteralPath $bat -Value (@($lines) + "exit /b !errorlevel!")
            cmd.exe /c $bat | Out-Host
            $LASTEXITCODE
          }
          $installer = Join-Path $work "python-installer.exe"
          $downloadLines = $prepare + $pinned + "set `"PYTHON_INSTALLER=$installer`"" + $download
          $code = Invoke-Lines download $downloadLines
          # One retry, so a passing python.org or network fault does not fail an unrelated change.
          if ($code -ne 0) { Start-Sleep -Seconds 15; $code = Invoke-Lines download $downloadLines }
          if ($code -ne 0) { throw "The download line of windows.bat failed with exit code $code" }
          $code = Invoke-Lines verify ($prepare + $pinned + "set `"PYTHON_INSTALLER=$installer`"" + $verify)
          if ($code -ne 0) { throw "The check in windows.bat refused the pinned Python installer: exit code $code" }
          # A copy with one byte changed fails the SHA-256, and, with its own SHA-256 pinned, the signature.
          $modified = Join-Path $work "python-installer-modified.exe"
          $bytes = [IO.File]::ReadAllBytes($installer)
          $bytes[[int]($bytes.Length / 2)] = $bytes[[int]($bytes.Length / 2)] -bxor 1
          [IO.File]::WriteAllBytes($modified, $bytes)
          $code = Invoke-Lines modified ($prepare + $pinned + "set `"PYTHON_INSTALLER=$modified`"" + $verify)
          if ($code -ne 1) { throw "The check in windows.bat returned $code for a modified Python installer" }
          $hash = (Get-FileHash -LiteralPath $modified -Algorithm SHA256).Hash.ToLower()
          $code = Invoke-Lines unsigned ($prepare + $pinned + "set `"PYTHON_SHA256=$hash`"" + "set `"PYTHON_INSTALLER=$modified`"" + $verify)
          if ($code -ne 1) { throw "The check in windows.bat returned $code for a modified Python installer with its SHA-256 pinned" }
          # Canary, not a test: the same check without clearing PSModulePath shows whether this runner has the fault it guards against.
          $unfixed = @($prepare | Where-Object { $_ -notmatch '^set "PSModulePath=' })
          if ($unfixed.Count -ne $prepare.Count - 1) { throw "windows.bat does not clear PSModulePath in its preparation" }
          $code = Invoke-Lines canary ($unfixed + $pinned + "set `"PYTHON_INSTALLER=$installer`"" + $verify)
          Write-Host "Canary: PowerShell $($PSVersionTable.PSVersion); without clearing PSModulePath the check exits with $code (1: the fault occurs on this runner)."
          Remove-Item -LiteralPath $work -Recurse -Force
          # The refusals above are the expected results; do not let them become the step's exit code.
          $global:LASTEXITCODE = 0

      - name: Install candidate on native Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          sima-cli install --vulcan --env "${{ vars.VULCAN_ENV || 'dev' }}" "sima-cli@${{ needs.build.outputs.ref_name }}:${{ needs.build.outputs.short_sha }}" --install-dir "$env:RUNNER_TEMP\sima-cli-vulcan-install"
          $versionOutput = & "$env:USERPROFILE\.sima-cli-env\Scripts\sima-cli.exe" --version
          $versionOutput
          if (($versionOutput -join "`n").Trim() -cne "SiMa CLI version: ${{ needs.build.outputs.version }}") {
            throw "Installed sima-cli version does not match expected version ${{ needs.build.outputs.version }}"
          }

      - name: Set up WSL2 Ubuntu on Windows
        if: runner.os == 'Windows'
        uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
          # Installing packages refreshes APT metadata. Avoid a full distro
          # upgrade on every ephemeral runner; it adds several variable minutes.
          use-cache: "true"
          additional-packages: ca-certificates curl python3 python3-venv python3-pip docker.io

      - name: Verify Docker on Ubuntu
        if: runner.os == 'Linux' && matrix.docker_install != 'snap'
        run: |
          docker info

      - name: Verify Docker on macOS
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          for docker_cli_dir in \
            "/Applications/Docker.app/Contents/Resources/bin" \
            "$HOME/.docker/bin" \
            "/opt/homebrew/bin" \
            "/usr/local/bin"; do
            if [[ -d "$docker_cli_dir" ]]; then
              echo "$docker_cli_dir" >> "$GITHUB_PATH"
              export PATH="$docker_cli_dir:$PATH"
            fi
          done
          command -v docker
          if ! docker info >/dev/null 2>&1; then
            if ! command -v colima >/dev/null 2>&1; then
              echo "::error::Docker is installed, but its daemon is unavailable and Colima is not installed."
              exit 1
            fi

            docker_context="$(docker context show)"
            docker_endpoint="$(docker context inspect "$docker_context" --format '{{.Endpoints.docker.Host}}')"
            if [[ "$docker_endpoint" =~ \.colima/([^/]+)/docker\.sock$ ]]; then
              colima_profile="${BASH_REMATCH[1]}"
            else
              echo "::error::Docker context '$docker_context' is unavailable but does not use a Colima socket: $docker_endpoint"
              exit 1
            fi

            echo "::warning::Docker is unavailable; starting Colima profile '$colima_profile'."
            colima start --profile "$colima_profile"

            for attempt in $(seq 1 30); do
              if docker info >/dev/null 2>&1; then
                break
              fi
              if [[ "$attempt" -eq 30 ]]; then
                echo "::error::Docker did not become ready within 60 seconds after starting Colima."
                colima status || true
                docker info || true
                exit 1
              fi
              echo "Waiting for Docker after Colima startup (attempt ${attempt}/30)..."
              sleep 2
            done
          fi
          docker info

      - name: Install Docker from Snap on Ubuntu
        if: runner.os == 'Linux' && matrix.docker_install == 'snap'
        run: |
          set -euo pipefail
          sudo systemctl stop docker.service docker.socket containerd.service || true
          sudo apt-get update
          sudo apt-get remove -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin moby-engine moby-cli containerd runc || true
          sudo apt-get install -y snapd
          sudo systemctl enable --now snapd.socket
          sudo ln -s /var/lib/snapd/snap /snap 2>/dev/null || true
          sudo snap install docker
          sudo snap start docker
          for _ in $(seq 1 60); do
            if sudo docker info >/dev/null 2>&1; then
              sudo chmod 666 /var/run/docker.sock || true
              docker info
              exit 0
            fi
            sudo snap services docker || true
            sleep 2
          done
          sudo journalctl -u snap.docker.dockerd -n 200 --no-pager || true
          exit 1

      - name: Start Docker in WSL2
        if: runner.os == 'Windows'
        shell: wsl-bash {0}
        run: |
          sudo nohup dockerd > /tmp/dockerd.log 2>&1 &
          for _ in $(seq 1 60); do
            if docker info >/dev/null 2>&1; then
              docker info
              sudo chmod 666 /var/run/docker.sock
              exit 0
            fi
            sleep 2
          done
          cat /tmp/dockerd.log
          exit 1

      - name: Install candidate
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          sima-cli install --vulcan --env "${{ vars.VULCAN_ENV || 'dev' }}" "sima-cli@${{ needs.build.outputs.ref_name }}:${{ needs.build.outputs.short_sha }}" --install-dir "${RUNNER_TEMP}/sima-cli-vulcan-install"
          candidate_version="$("$HOME/.sima-cli/.venv/bin/sima-cli" --version)"
          printf '%s\n' "$candidate_version"
          test "$candidate_version" = "SiMa CLI version: ${{ needs.build.outputs.version }}"
          "$HOME/.sima-cli/.venv/bin/sima-cli" install ghcr:sima-neat/sdk
          if [[ "${{ matrix.docker_install }}" == "snap" ]]; then
            mkdir -p "$HOME/.sima-cli"
            printf '{}\n' > "$HOME/.sima-cli/.tokens.json"
            chmod 600 "$HOME/.sima-cli/.tokens.json"
          fi
          docker rm -f ghcr.io-sima-neat-sdk-latest || true
          "$HOME/.sima-cli/.venv/bin/sima-cli" sdk setup -y -n --minimal

      - name: Test CloudEx forwarder install and update
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          bash tests/e2e/test_cloudex_forwarder_install.sh \
            "$HOME/.sima-cli/.venv/bin/sima-cli"

      - name: Install candidate in WSL2
        if: runner.os == 'Windows'
        shell: wsl-bash {0}
        run: |
          python3 -m venv /tmp/workflow-sima-cli
          /tmp/workflow-sima-cli/bin/python -m pip install --upgrade pip
          /tmp/workflow-sima-cli/bin/python -m pip install .
          /tmp/workflow-sima-cli/bin/sima-cli --version
          /tmp/workflow-sima-cli/bin/sima-cli install --vulcan --env "${{ vars.VULCAN_ENV || 'dev' }}" "sima-cli@${{ needs.build.outputs.ref_name }}:${{ needs.build.outputs.short_sha }}" --install-dir /tmp/sima-cli-vulcan-install
          candidate_version="$("$HOME/.sima-cli/.venv/bin/sima-cli" --version)"
          printf '%s\n' "$candidate_version"
          test "$candidate_version" = "SiMa CLI version: ${{ needs.build.outputs.version }}"
          "$HOME/.sima-cli/.venv/bin/sima-cli" install ghcr:sima-neat/sdk
          docker rm -f ghcr.io-sima-neat-sdk-latest || true
          "$HOME/.sima-cli/.venv/bin/sima-cli" sdk setup -y -n --minimal

      - name: Test CloudEx forwarder install and update in WSL2
        if: runner.os == 'Windows'
        shell: wsl-bash {0}
        run: |
          bash tests/e2e/test_cloudex_forwarder_install.sh \
            "$HOME/.sima-cli/.venv/bin/sima-cli"

      - name: Verify CloudEx forwarder is unsupported on native Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # A nonzero exit is the expected native-Windows contract. Capture it
          # without letting PowerShell promote native stderr into a step error.
          $ErrorActionPreference = "Continue"
          $output = (& "$env:USERPROFILE\.sima-cli-env\Scripts\sima-cli.exe" -i cloudex update 2>&1 | Out-String)
          $exitCode = $LASTEXITCODE
          $ErrorActionPreference = "Stop"
          if ($exitCode -eq 0) {
            throw "CloudEx forwarder update unexpectedly succeeded on native Windows"
          }
          if ($output -notmatch "packages are unavailable for Windows") {
            throw "CloudEx returned an unexpected native Windows error: $output"
          }
          exit 0

  promote-latest:
    permissions:
      contents: read
      id-token: write
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Promote Tested Latest
    runs-on: ubuntu-latest
    needs:
      - build
      - resolve-vulcan-config
      - e2e-install
    environment: ${{ needs.resolve-vulcan-config.outputs.vulcan_env }}
    env:
      AWS_REGION: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
      ARTIFACT_BUCKET: ${{ needs.resolve-vulcan-config.outputs.artifact_bucket }}
      ROLE_TO_ASSUME: ${{ needs.resolve-vulcan-config.outputs.artifact_publisher_role_arn }}
      SSE_KMS_KEY_ID: ${{ needs.resolve-vulcan-config.outputs.artifact_kms_key_id }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ needs.resolve-vulcan-config.outputs.artifact_cloudfront_distribution_id }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ needs.resolve-vulcan-config.outputs.aws_region }}
          role-to-assume: ${{ needs.resolve-vulcan-config.outputs.artifact_publisher_role_arn }}
          role-session-name: vulcan-promote-${{ github.run_id }}

      - name: Promote commit as latest
        run: |
          set -euo pipefail
          mkdir -p _vulcan/promote
          printf '%s\n' "${{ needs.build.outputs.short_sha }}" > _vulcan/promote/latest.tag

          s3_args=(--content-type text/plain --sse aws:kms)
          if [[ -n "${SSE_KMS_KEY_ID:-}" ]]; then
            s3_args+=(--sse-kms-key-id "${SSE_KMS_KEY_ID}")
          fi

          aws s3 cp \
            _vulcan/promote/latest.tag \
            "s3://${ARTIFACT_BUCKET}/sima-cli/${{ needs.build.outputs.branch_key }}/latest.tag" \
            "${s3_args[@]}"

          if [[ -n "${CLOUDFRONT_DISTRIBUTION_ID:-}" ]]; then
            aws cloudfront create-invalidation \
              --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
              --paths "/sima-cli/${{ needs.build.outputs.branch_key }}/latest.tag"
          fi
